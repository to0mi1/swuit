def gitVersion = {
    try {
        def proc = ['git', 'describe', '--tags', '--match', 'v*'].execute()
        proc.waitFor()
        if (proc.exitValue() != 0) return '0.0.0-SNAPSHOT'
        def describe = proc.text.trim()
        def match = (describe =~ /^v(\d+)\.(\d+)\.(\d+)(-([a-zA-Z][a-zA-Z0-9.]*?))?(-(\d+)-g[0-9a-f]+)?$/)
        if (match.matches()) {
            def major = match.group(1)
            def minor = match.group(2)
            def patch = match.group(3) as int
            def preRelease = match.group(5) // e.g. "beta.1"
            if (match.group(6) != null) {
                // タグからコミットが進んでいる場合は SNAPSHOT
                return "${major}.${minor}.${patch + 1}-SNAPSHOT"
            }
            if (preRelease != null) {
                return "${major}.${minor}.${patch}-${preRelease}"
            }
            return "${major}.${minor}.${patch}"
        }
    } catch (Exception ignored) {}
    return '0.0.0-SNAPSHOT'
}()

subprojects {
    apply plugin: 'java'

    group = 'org.to0mi1'
    version = gitVersion

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }
}
